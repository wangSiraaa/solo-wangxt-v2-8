# MySQL profile. Prerequisites:
#   1) mysql -u root -p < src/main/resources/db/schema-mysql.sql
#   2) mysql -u root -p craft        < src/main/resources/db/data-seed-mysql.sql
# Then run: java -jar app.jar --spring.profiles.active=mysql
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/craft?useSSL=false&serverTimezone=UTC&characterEncoding=utf8mb4&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:craft}
    password: ${DB_PASSWORD:craft}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      transaction-isolation: TRANSACTION_READ_COMMITTED
  sql:
    init:
      mode: never
